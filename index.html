<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор чек-листов для Битрикс24</title>
    <style>
        /* --- ДИЗАЙН (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .panels {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 350px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-copy { background-color: #2ecc71; color: white; }
        .btn-copy:hover { background-color: #27ae60; }
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-clear:hover { background-color: #c0392b; }

        #copy-status {
            text-align: center;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 10px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Генератор чек-листов для Битрикс24</h1>

        <div class="panels">
            <div class="panel">
                <label for="input-text">Исходный текст:</label>
                <textarea id="input-text" placeholder="Введите текст сюда..."></textarea>
            </div>

            <div class="panel">
                <label for="output-text">Результат для импорта в Битрикс24:</label>
                <textarea id="output-text" readonly placeholder="Здесь появится готовый код..."></textarea>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-copy" id="btn-copy">Копировать результат</button>
            <button class="btn-clear" id="btn-clear">Очистить всё</button>
        </div>

        <div id="copy-status"></div>
    </div>

    <script>
        // --- ЛОГИКА (JavaScript) ---

        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const btnCopy = document.getElementById('btn-copy');
        const btnClear = document.getElementById('btn-clear');
        const copyStatus = document.getElementById('copy-status');

        // Функция для преобразования текста
        function formatForBitrix() {
            let text = inputText.value;

            // 1. Убираем пустые строки в начале и конце всего текста
            text = text.trim();
            if (!text) {
                outputText.value = '';
                return;
            }

            // 2. Разбиваем текст на строки и убираем пустые строки (фильтруем)
            let lines = text.split('\n')
                .map(line => line.trim())
                .filter(line => line !== '');

            // 3. Умная разбивка, если текст написан в одну строку (или слипся)
            // Проверяем каждую строку: если она длинная и содержит много заглавных букв,
            // пытаемся разбить её на части перед заглавными буквами.
            let expandedLines = [];

            for (let line of lines) {
                // Регулярное выражение ищет заглавные буквы (кириллица и латиница)
                // (?<=.) - значит, что перед заглавной буквой должен быть хоть какой-то символ
                // \s+ - пробел перед заглавной буквой (чтобы не резать слова вроде "МВидео")
                // Но мы сделаем проще и безопаснее: ищем пробел + Заглавная буква.
                // Исключение: если перед нами аббревиатура (2+ заглавные подряд), не режем.

                // Разбиваем по пробелу, за которым идет заглавная буква
                // (?!^) - не в начале строки
                // \s(?=[А-ЯA-Z]) - пробел, после которого заглавная
                let parts = line.split(/(?<=\S)\s+(?=[А-ЯЁA-Z])/);

                // Если частей получилось больше одной, добавляем их все.
                // Но нам нужно защитить аббревиатуры.
                let goodParts = [];
                let currentPart = "";

                for (let part of parts) {
                    // Если часть начинается с 2+ заглавных букв подряд (например, "ООО Ромашка"),
                    // она может быть началом нормального предложения, а не просто новым пунктом.
                    // Проверяем, не является ли это продолжением предыдущего.
                    if (currentPart === "") {
                        currentPart = part;
                    } else {
                        // Если мы видим, что это просто короткое слово капсом (до 4 букв), приклеиваем обратно
                        const firstWord = part.split(' ')[0];
                        if (firstWord.length <= 3 && firstWord === firstWord.toUpperCase() && /^[А-ЯЁA-Z]+$/.test(firstWord)) {
                            currentPart += " " + part;
                        } else {
                            goodParts.push(currentPart);
                            currentPart = part;
                        }
                    }
                }
                if (currentPart) goodParts.push(currentPart);

                // Если разбивка дала результат, используем его, иначе оставляем как было
                if (goodParts.length > 1) {
                    expandedLines.push(...goodParts);
                } else {
                    expandedLines.push(line);
                }
            }

            let resultLines = [];
            let hasChecklist = false;

            // 4. Формируем итоговый текст
            for (let i = 0; i < expandedLines.length; i++) {
                const line = expandedLines[i];
                const lowerLine = line.toLowerCase();

                // Проверка на заголовок (Чек-лист...)
                const isHeader = /^(чек-лист|чек лист|чеклист)/i.test(lowerLine);

                if (isHeader) {
                    hasChecklist = true;
                    // Если перед этим были пункты, добавляем пустую строку для разделения чек-листов
                    if (resultLines.length > 0) {
                        resultLines.push('');
                    }
                    resultLines.push(`[**]${line}`);
                } else {
                    // Если это первый текст и заголовка нет — создаем дефолтный
                    if (!hasChecklist && resultLines.length === 0) {
                         resultLines.push('[**]Чек-лист');
                         hasChecklist = true;
                    }
                    resultLines.push(`[*]${line}`);
                }
            }

            // 5. Убираем возможные лишние пустые строки в конце и склеиваем
            while (resultLines.length > 0 && resultLines[resultLines.length - 1] === '') {
                resultLines.pop();
            }

            outputText.value = resultLines.join('\n');
        }

        inputText.addEventListener('input', formatForBitrix);

        btnCopy.addEventListener('click', () => {
            if (!outputText.value) return;
            navigator.clipboard.writeText(outputText.value).then(() => {
                copyStatus.textContent = '✅ Скопировано в буфер обмена!';
                copyStatus.style.opacity = '1';
                setTimeout(() => { copyStatus.style.opacity = '0'; }, 2000);
            }).catch(err => {
                alert('Ошибка при копировании: ' + err);
            });
        });

        btnClear.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            inputText.focus();
        });
    </script>
</body>
</html>
