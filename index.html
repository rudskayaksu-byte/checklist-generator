<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор чек-листов для Битрикс24</title>
    <style>
        /* --- ДИЗАЙН (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .panels {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 350px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-copy { background-color: #2ecc71; color: white; }
        .btn-copy:hover { background-color: #27ae60; }
        .btn-clear { background-color: #e74c3c; color: white; }
        .btn-clear:hover { background-color: #c0392b; }

        /* --- АНИМАЦИЯ КОТА --- */
        #copy-image {
            width: 60px;
            height: 60px;
            opacity: 0;
            /* Начальное состояние: невидимый и уменьшенный */
            transform: scale(0.5);
            /* Плавность для прозрачности и масштаба */
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            object-fit: contain;
        }

        /* Класс, который делает кота видимым и большим */
        #copy-image.show {
            opacity: 1;
            transform: scale(1); /* Увеличиваем до нормального размера */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Генератор чек-листов для Битрикс24</h1>

        <div class="panels">
            <div class="panel">
                <label for="input-text">Исходный текст:</label>
                <textarea id="input-text" placeholder="Введите текст сюда..."></textarea>
            </div>

            <div class="panel">
                <label for="output-text">Результат для импорта в Битрикс24:</label>
                <textarea id="output-text" readonly placeholder="Здесь появится готовый код..."></textarea>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-copy" id="btn-copy">Копировать результат</button>

            <!-- Кот -->
            <img id="copy-image" src="cat.png" alt="Скопировано!">

            <button class="btn-clear" id="btn-clear">Очистить всё</button>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const btnCopy = document.getElementById('btn-copy');
        const btnClear = document.getElementById('btn-clear');
        const copyImage = document.getElementById('copy-image');

        function cleanLine(line) {
            line = line.replace(/\u00A0/g, ' ').trim();
            line = line.replace(/^[\s\-*•–—]+|^\[[\sxX✓vV]?\]\s*/g, '');
            line = line.replace(/^\d+[\.\)\-]\s*/, '');
            return line.trim();
        }

        function formatForBitrix() {
            let text = inputText.value.trim();
            if (!text) {
                outputText.value = '';
                return;
            }

            let lines = text.split('\n')
                .map(line => cleanLine(line))
                .filter(line => line !== '');

            let expandedLines = [];
            for (let line of lines) {
                let parts = line.split(/(?<=\S)\s+(?=[А-ЯЁA-Z])/);
                let goodParts = [];
                let currentPart = "";

                for (let part of parts) {
                    if (currentPart === "") {
                        currentPart = part;
                    } else {
                        const firstWord = part.split(' ')[0];
                        if (firstWord.length <= 3 && firstWord === firstWord.toUpperCase() && /^[А-ЯЁA-Z]+$/.test(firstWord)) {
                            currentPart += " " + part;
                        } else {
                            goodParts.push(currentPart);
                            currentPart = part;
                        }
                    }
                }
                if (currentPart) goodParts.push(currentPart);

                if (goodParts.length > 1) {
                    expandedLines.push(...goodParts);
                } else {
                    expandedLines.push(line);
                }
            }

            let resultLines = [];
            let currentBlockHasHeader = false;

            for (let i = 0; i < expandedLines.length; i++) {
                const line = expandedLines[i];
                const lowerLine = line.toLowerCase();
                const isHeader = /^(чек-лист|чек лист|чеклист)/i.test(lowerLine);

                if (isHeader) {
                    if (resultLines.length > 0) resultLines.push('');
                    resultLines.push(`[**]${line}`);
                    currentBlockHasHeader = true;
                } else {
                    if (!currentBlockHasHeader) {
                        resultLines.push('[**]Чек-лист');
                        currentBlockHasHeader = true;
                    }
                    resultLines.push(`[*]${line}`);
                }
            }

            while (resultLines.length > 0 && resultLines[resultLines.length - 1] === '') {
                resultLines.pop();
            }

            outputText.value = resultLines.join('\n');
        }

        inputText.addEventListener('input', formatForBitrix);

        btnCopy.addEventListener('click', () => {
            if (!outputText.value) return;

            navigator.clipboard.writeText(outputText.value).then(() => {
                // Добавляем класс, который запускает анимацию появления и увеличения
                copyImage.classList.add('show');

                // Через 2 секунды убираем класс, и кот плавно исчезает
                setTimeout(() => {
                    copyImage.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('Ошибка при копировании: ' + err);
            });
        });

        btnClear.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            inputText.focus();
        });
    </script>
</body>
</html>
